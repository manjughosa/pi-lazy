name: Publish Package to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1). Defaults to v + package.json version on the selected ref."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # For tag pushes this is the tag commit; for manual runs use the chosen ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing (OIDC) needs npm CLI >= 11.5.1, which ships with Node 24.
          # Node 22 gives npm 10.x, where OIDC is not detected and the publish fails
          # with a 2FA error even when the trusted publisher is configured correctly.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test, typecheck, and build
        run: npm test

      - name: Smoke-test built artifact
        run: npm run test:smoke

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.tag }}"
            if [ -z "$RAW" ]; then
              TAG="v${PKG}"
            else
              TAG="${RAW#v}"
              TAG="v${TAG}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          EXPECTED="${TAG#v}"
          if [ "$EXPECTED" != "$PKG" ]; then
            echo "Tag ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          # Skip if this version is already on npm
          if npm view "pi-lazy@${PKG}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG} is already on npm — nothing to do"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${PKG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing candidate pi-lazy@${PKG} (${TAG})"

      # Authentication is OIDC trusted publishing, not a token. npm CLI 11.5.1+
      # detects the GitHub OIDC environment and mints a short-lived credential, so
      # there is no NPM_TOKEN secret to create, leak, or rotate.
      #
      # Bootstrap caveat: a trusted publisher can only be configured on a package
      # that already exists, so the very first release of a brand-new package must
      # be published by hand. After that, npmjs.com -> package -> Settings ->
      # Trusted publishing -> add this repo + workflow, and every later `v*` tag
      # publishes itself.
      - name: Publish to npm
        if: steps.version.outputs.already_published != 'true'
        run: |
          set -o pipefail
          LOG="$(mktemp)"
          if npm publish --access public --provenance 2>&1 | tee "$LOG"; then
            exit 0
          fi
          if grep -q 'TLOG_CREATE_ENTRY_ERROR' "$LOG" && grep -q 'equivalent entry already exists' "$LOG"; then
            echo "npm provenance transparency-log entry already exists; retrying without provenance"
            npm publish --access public
            exit 0
          fi
          exit 1
